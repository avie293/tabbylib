plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

// Vanilla Minecraft only, no loader: the loader specific code is in fabric and neoforge
neoForge {
	neoFormVersion = neo_form_version
}

dependencies {
	compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
	// Only for TabbyConfig#modContainer, which is kept for Fabric mods
	compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

// The loader projects compile these sources and resources into their jars
configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
