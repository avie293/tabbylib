plugins {
	id 'java'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group_id

base {
	archivesName = "${mod_id}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
			args '--mixin.config', 'tabbylib.mixins.json'
		}
		register('client')
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.withType(ProcessResources).configureEach {
	def replaceProperties = [
		minecraft_version_range: minecraft_version_range,
		forge_version_range: forge_version_range,
		mod_id: mod_id,
		mod_version: mod_version
	]
	inputs.properties(replaceProperties)
	filesMatching('META-INF/mods.toml') {
		expand(replaceProperties)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
}

jar {
	manifest {
		attributes 'MixinConfigs': 'tabbylib.mixins.json'
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "tabbylib-forge"
			from components.java
		}
	}
}

// Public maven repository (public/maven of the website, https://avie.cc/maven). Filled by "gradlew publish".
publishing {
	repositories {
		maven {
			name = "website"
			url = rootProject.file("../../TabbyLib-Website/public/maven").toURI()
		}
	}
}
