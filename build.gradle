plugins {
	id 'eclipse'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
	archivesName = "${mod_id}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
	mappings channel: 'official', version: minecraft_version

	runs {
		client {
			workingDirectory project.file('run')
			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
	compileOnly 'org.jspecify:jspecify:1.0.0'
}

tasks.named('processResources', ProcessResources).configure {
	def replaceProperties = [
		minecraft_version_range: minecraft_version_range,
		forge_version_range: forge_version_range,
		mod_id: mod_id,
		mod_version: mod_version
	]
	inputs.properties replaceProperties
	filesMatching('META-INF/mods.toml') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
}

// Minecraft 1.20.1 runs with obfuscated names, so the jar is converted back after building
tasks.named('jar', Jar).configure {
	finalizedBy 'reobfJar'
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			artifactId = "tabbylib-forge"
			artifact jar
			artifact sourcesJar
		}
	}
}

// Public maven repository (the TabbyLib website, served by GitHub Pages). Filled by "gradlew publish".
publishing {
	repositories {
		maven {
			name = "website"
			url = rootProject.file("../../TabbyLib-Website/maven").toURI()
		}
	}
}
