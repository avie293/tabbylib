plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom'
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Only for the automatic config buttons in Mod Menu, players do not need Mod Menu
	compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

// Fabric mods depend on cc.avie.tabbylib:tabbylib, so the Fabric jar keeps that name in the maven
publishing.publications.named('mavenJava') {
	artifactId = mod_id
}
